set $mod Mod4
font pango:Noto Sans 10
output * scale 1
input type:keyboard {
    xkb_layout us,ara
    xkb_options grp:alt_shift_toggle
}
exec --no-startup-id waybar
exec --no-startup-id mako
exec --no-startup-id gammastep -c /etc/gammastep.conf
exec --no-startup-id fetian-sway-ready
exec --no-startup-id nm-applet --indicator
exec --no-startup-id /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
bindsym $mod+Return exec foot
bindsym $mod+d exec wofi --show drun --allow-images --prompt 'Search applications'
bindsym $mod+space exec wofi --show drun --allow-images --prompt 'Search applications'
bindsym $mod+Shift+a exec fetian-apps
bindsym $mod+comma exec fetian-control-center
bindsym $mod+l exec systemctl --user start fetian-sway-lock.service
bindsym $mod+Shift+q kill
bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m 'Exit FetianOS?' -b 'Logout' 'swaymsg exit'
bindsym Print exec fetian-screenshot region
bindsym $mod+Print exec fetian-screenshot screen
bindsym XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym XF86MonBrightnessUp exec brightnessctl set 5%+
bindsym XF86MonBrightnessDown exec brightnessctl set 5%-
bindsym $mod+Shift+n exec gammastep -O 3900
bindsym $mod+Ctrl+n exec gammastep -x
for_window [app_id="pavucontrol"] floating enable
default_border pixel 2
client.focused #e4ad55 #e4ad55 #17181b #e4ad55 #e4ad55
client.unfocused #343238 #343238 #b8b4aa #343238 #343238
